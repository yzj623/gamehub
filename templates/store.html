<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏商城</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
    <div class="bg-glow-extra"></div>
    <header>

        <div class="nav-left">
            <a href="/" class="logo">Game<span>Hub</span></a>
            <a href="/">商店</a>
            <a href="/publisher" id="nav-publisher" style="display:none;">发行商后台</a>

        </div>
        <nav class="nav-right">
            <a href="/login" id="nav-login">登录</a>
            <a href="/register" id="nav-register">注册</a>
            <a href="/profile" id="nav-profile" style="display:none;">个人主页</a>
            <div class="nav-menu" id="nav-mail-menu" style="display:none;">
                <button class="nav-btn" id="nav-mail">邮箱</button>
                <div class="nav-panel" id="nav-mail-panel">
                    <h3>邮箱</h3>
                    <div id="mail-list"></div>
                    <p class="notice" id="mail-empty"></p>
                    <h3 style="margin-top:12px;">好友申请</h3>
                    <div id="mail-friend-requests"></div>
                    <p class="notice" id="mail-request-empty"></p>
                </div>
            </div>
            <div class="nav-menu" id="nav-friends-menu" style="display:none;">
                <button class="nav-btn" id="nav-friends">好友</button>
                <div class="nav-panel" id="nav-friends-panel">
                    <h3>好友列表</h3>
                    <div id="nav-friend-list"></div>
                    <p class="notice" id="nav-friend-empty"></p>
                    <h3 style="margin-top:12px;">搜索好友</h3>
                    <div class="reply-form">
                        <input type="text" id="nav-friend-search" placeholder="输入用户名" />
                        <button class="btn secondary" id="nav-friend-search-btn">搜索</button>
                    </div>
                    <div class="reply-form" style="margin-top:8px;">
                        <input type="text" id="nav-friend-message" maxlength="30" placeholder="申请说明（30字内）" />
                    </div>
                    <div id="nav-friend-results"></div>
                </div>
            </div>
            <button class="nav-btn" id="nav-logout" style="display:none;">退出登录</button>
        </nav>
    </header>
    <main class="container">
        <section class="hero">
            <h2>探索你的下一款游戏</h2>
            <p>精选好评榜与价格榜，快速发现值得入手的作品。</p>
        </section>
        <section class="section panel search-panel">
            <div class="row center">
                <div>
                    <div class="title">搜索游戏</div>
                    <div class="subtitle">输入游戏名称快速查找</div>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索游戏名称..." />
                    <button class="btn" id="search-btn">搜索</button>
                </div>
            </div>
        </section>
        <section class="section panel" id="ad-section">
            <div class="row center">
                <div>
                    <div class="title">发行商广告</div>
                    <div class="subtitle">每 2 秒滚动展示最新推广内容</div>
                </div>
            </div>
            <div class="ad-carousel">
                <div class="ad-track" id="ad-track"></div>
            </div>
        </section>

        <section class="section panel" id="rank-section">
            <div class="row center">
                <div>
                    <div class="title">榜单切换</div>
                    <div class="subtitle">支持好评榜与价格榜即时切换</div>
                </div>
                <div class="row">
                    <button class="btn active" id="btn-all">全部游戏</button>
                    <button class="btn secondary" id="btn-top">好评榜</button>
                    <button class="btn secondary" id="btn-selling">销量榜</button>
                    <button class="btn secondary" id="btn-price-asc">价格榜⬇</button>
                    <button class="btn secondary" id="btn-price-desc">价格榜⬆</button>

                </div>
            </div>
        </section>

        <p class="notice" id="status">正在加载游戏列表...</p>

        <section class="grid" id="game-grid"></section>

    </main>
    <script src="/static/js/store.js"></script>
    <script src="/static/js/nav.js"></script>
</body>

</html>
