<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>私信 - Game Hub</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            background: #1b2838;
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            background: #171a21;
            border-bottom: 1px solid #2a3f5e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 18px;
            color: #c7d5e0;
        }

        .chat-header .back-btn {
            color: #66c0f4;
            text-decoration: none;
            font-size: 14px;
            margin-left: auto;
        }

        .chat-header .back-btn:hover {
            color: #a4d7f5;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-messages .message.me {
            align-self: flex-end;
            background: #2a6b9c;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-messages .message.other {
            align-self: flex-start;
            background: #2a3f5e;
            color: #c7d5e0;
            border-bottom-left-radius: 4px;
        }

        .chat-messages .message .msg-time {
            font-size: 11px;
            color: #8f98a0;
            margin-top: 4px;
            text-align: right;
        }

        .chat-messages .message.me .msg-time {
            color: #a4d7f5;
        }

        .chat-messages .message img.msg-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-messages .message .msg-sender {
            font-size: 12px;
            color: #66c0f4;
            margin-bottom: 4px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: #171a21;
            border-top: 1px solid #2a3f5e;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #2a3f5e;
            border-radius: 6px;
            background: #1b2838;
            color: #c7d5e0;
            font-size: 14px;
            resize: none;
            min-height: 40px;
            max-height: 120px;
        }

        .chat-input-area textarea:focus {
            outline: none;
            border-color: #66c0f4;
        }

        .chat-input-area .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .chat-input-area .btn.send {
            background: #2a6b9c;
            color: #fff;
        }

        .chat-input-area .btn.send:hover {
            background: #3a8bc4;
        }

        .chat-input-area .btn.image-btn {
            background: #2a3f5e;
            color: #c7d5e0;
        }

        .chat-input-area .btn.image-btn:hover {
            background: #3a5f7e;
        }

        .chat-input-area .image-preview {
            display: none;
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .chat-input-area .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .chat-input-area .image-preview .remove-image {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: #c14a4a;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8f98a0;
            font-size: 16px;
        }

        /* Image modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .image-modal .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="bg-glow-extra"></div>
    <header>
        <div class="nav-left">
            <a href="/" class="logo">Game<span>Hub</span></a>
            <a href="/">商店</a>
            <a href="/publisher" id="nav-publisher" style="display:none;">发行商后台</a>

        </div>
        <nav class="nav-right">
            <a href="/login" id="nav-login">登录</a>
            <a href="/register" id="nav-register">注册</a>
            <a href="/profile" id="nav-profile" style="display:none;">个人主页</a>
            <div class="nav-menu" id="nav-mail-menu" style="display:none;">
                <button class="nav-btn" id="nav-mail">邮箱</button>
                <div class="nav-panel" id="nav-mail-panel">
                    <h3>邮箱</h3>
                    <div id="mail-list"></div>
                    <p class="notice" id="mail-empty"></p>
                    <h3 style="margin-top:12px;">好友申请</h3>
                    <div id="mail-friend-requests"></div>
                    <p class="notice" id="mail-request-empty"></p>
                </div>
            </div>
            <div class="nav-menu" id="nav-friends-menu" style="display:none;">
                <button class="nav-btn" id="nav-friends">好友</button>
                <div class="nav-panel" id="nav-friends-panel">
                    <h3>好友列表</h3>
                    <div id="nav-friend-list"></div>
                    <p class="notice" id="nav-friend-empty"></p>
                    <h3 style="margin-top:12px;">搜索好友</h3>
                    <div class="reply-form">
                        <input type="text" id="nav-friend-search" placeholder="输入用户名" />
                        <button class="btn secondary" id="nav-friend-search-btn">搜索</button>
                    </div>
                    <div class="reply-form" style="margin-top:8px;">
                        <input type="text" id="nav-friend-message" maxlength="30" placeholder="申请说明（30字内）" />
                    </div>
                    <div id="nav-friend-results"></div>
                </div>
            </div>
            <button class="nav-btn" id="nav-logout" style="display:none;">退出登录</button>
        </nav>
    </header>

    <div class="chat-container">

        <div class="chat-header">
            <img id="chat-friend-avatar" src="" alt="avatar" />
            <h2 id="chat-friend-name">加载中...</h2>
            <a class="back-btn" href="javascript:history.back()">← 返回</a>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="chat-empty">加载中...</div>
        </div>

        <div class="chat-input-area">
            <div class="image-preview" id="image-preview">
                <img id="preview-img" src="" alt="preview" />
                <button class="remove-image" id="remove-image-btn">×</button>
            </div>
            <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
            <button class="btn image-btn" id="image-btn">图片</button>
            <button class="btn send" id="send-btn">发送</button>
            <input type="file" id="image-input" accept="image/*" style="display:none" />
        </div>
    </div>

    <!-- Image modal -->
    <div class="image-modal" id="image-modal">
        <span class="close-modal" id="close-modal">&times;</span>
        <img id="modal-img" src="" alt="full image" />
    </div>

    <script src="/static/js/nav.js"></script>
    <script>
        const friendId = {{ friend_id }};
        let lastMsgId = 0;
        let pollTimer = null;

        async function loadChat() {
            const container = document.getElementById("chat-messages");
            try {
                const data = await fetchJson(`/api/friend-chat/${friendId}`);

                // Update header
                document.getElementById("chat-friend-avatar").src = data.friend.avatar_url;
                document.getElementById("chat-friend-name").textContent = data.friend.username;

                // Render messages
                container.innerHTML = "";
                if (!data.messages || data.messages.length === 0) {
                    container.innerHTML = '<div class="chat-empty">开始聊天吧！</div>';
                    lastMsgId = 0;
                    return;
                }

                data.messages.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = `message ${msg.is_me ? "me" : "other"}`;

                    let html = "";
                    if (msg.content) {
                        html += `<div>${escapeHtml(msg.content)}</div>`;
                    }
                    if (msg.image_url) {
                        html += `<img class="msg-image" src="${msg.image_url}" alt="image" onclick="openModal('${msg.image_url}')" />`;
                    }
                    html += `<div class="msg-time">${formatTime(msg.created_at)}</div>`;
                    div.innerHTML = html;
                    container.appendChild(div);
                    lastMsgId = msg.msg_id;
                });


                // Scroll to bottom
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                container.innerHTML = `<div class="chat-empty">加载失败: ${e.message}</div>`;
            }
        }

        async function pollNewMessages() {
            try {
                const data = await fetchJson(`/api/friend-chat/${friendId}`);
                const container = document.getElementById("chat-messages");

                // Check if there are new messages
                const newMessages = data.messages ? data.messages.filter(m => m.msg_id > lastMsgId) : [];
                if (newMessages.length === 0) return;

                // Remove empty state
                const empty = container.querySelector(".chat-empty");
                if (empty) container.innerHTML = "";

                newMessages.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = `message ${msg.is_me ? "me" : "other"}`;

                    let html = "";
                    if (msg.content) {
                        html += `<div>${escapeHtml(msg.content)}</div>`;
                    }
                    if (msg.image_url) {
                        html += `<img class="msg-image" src="${msg.image_url}" alt="image" onclick="openModal('${msg.image_url}')" />`;
                    }
                    html += `<div class="msg-time">${formatTime(msg.created_at)}</div>`;
                    div.innerHTML = html;
                    container.appendChild(div);
                    lastMsgId = msg.msg_id;
                });


                container.scrollTop = container.scrollHeight;
            } catch (e) {
                // Silently ignore poll errors
            }
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const imageInput = document.getElementById("image-input");
            const content = input.value.trim();
            const file = imageInput.files[0];

            if (!content && !file) return;

            const formData = new FormData();
            formData.append("receiver_id", friendId);
            if (content) {
                formData.append("content", content);
            }
            if (file) {
                formData.append("image", file);
            }

            try {
                const res = await fetch("/api/friend-chat/send", {
                    method: "POST",
                    body: formData,
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || "发送失败");
                    return;
                }
                // Clear input
                input.value = "";
                imageInput.value = "";
                document.getElementById("image-preview").style.display = "none";
                document.getElementById("preview-img").src = "";

                // Reload chat to show new message
                await loadChat();
            } catch (e) {
                alert("发送失败: " + e.message);
            }
        }

        // Image preview
        document.getElementById("image-btn").addEventListener("click", () => {
            document.getElementById("image-input").click();
        });

        document.getElementById("image-input").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) {
                document.getElementById("image-preview").style.display = "none";
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById("preview-img").src = ev.target.result;
                document.getElementById("image-preview").style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("remove-image-btn").addEventListener("click", () => {
            document.getElementById("image-input").value = "";
            document.getElementById("image-preview").style.display = "none";
            document.getElementById("preview-img").src = "";
        });

        // Send on button click
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        // Send on Enter (Shift+Enter for new line)
        document.getElementById("chat-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Image modal
        function openModal(src) {
            document.getElementById("modal-img").src = src;
            document.getElementById("image-modal").style.display = "flex";
        }
        document.getElementById("close-modal").addEventListener("click", () => {
            document.getElementById("image-modal").style.display = "none";
        });
        document.getElementById("image-modal").addEventListener("click", (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById("image-modal").style.display = "none";
            }
        });

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const pad = n => String(n).padStart(2, "0");
            return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // Init
        loadChat();

        // Poll for new messages every 3 seconds
        pollTimer = setInterval(pollNewMessages, 3000);

        // Cleanup on page unload
        window.addEventListener("beforeunload", () => {
            if (pollTimer) clearInterval(pollTimer);
        });
    </script>
</body>

</html>
